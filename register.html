<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Let's Chat</title>
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#0b141a; font-family:Arial,sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; }
        .container{ width:90%; max-width:400px; background:#202c33; padding:30px; border-radius:15px; }
        h1{ text-align:center; color:#25D366; margin-bottom:20px; }
        input{ width:100%; padding:14px; margin:10px 0; border:none; border-radius:8px; background:#2a3942; color:white; font-size:16px; }
        button{ width:100%; padding:14px; background:#25D366; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; margin-top:10px; }
        button:hover{ opacity:0.9; }
        p{ text-align:center; margin-top:20px; color:white; }
        a{ color:#25D366; text-decoration:none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Create Account</h1>
    
    <!-- Added IDs to these inputs -->
    <input type="text" id="fullname" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">

    <!-- Changed button to call our new validation function -->
    <button onclick="handleRegister()">Create Account</button>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>
</div>

<script>
    function handleRegister() {
        const name = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Validation Check: Ensures no field is empty
        if (name.trim() === "" || email.trim() === "" || password.trim() === "") {
            alert("Please fill in all fields to create an account!");
            return;
        }

        // Proceed to dashboard if validation passes
        window.location.href = 'dashboard.html';
    }
</script>

</body>
</html>
