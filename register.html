<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Let's Chat</title>

<link rel="stylesheet" href="styles.css">

<style>
body{
    background:#0b141a;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    width:90%;
    max-width:400px;
    background:#202c33;
    padding:30px;
    border-radius:15px;
}

.logo{
    text-align:center;
    font-size:40px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#25D366;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#2a3942;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

p{
    text-align:center;
    margin-top:20px;
    color:white;
}

a{
    color:#25D366;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">💬</div>

    <h1>Create Account</h1>

    <input type="text" id="fullname" placeholder="Full Name">

    <input type="email" id="email" placeholder="Email Address">

    <input type="password" id="password" placeholder="Password">

    <button onclick="register()">
        Create Account
    </button>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBqfgZ5viIKnzhXMVYctbf-L3NTaSo6bSI",
  authDomain: "let-s-chat-3f5c2.firebaseapp.com",
  projectId: "let-s-chat-3f5c2",
  storageBucket: "let-s-chat-3f5c2.firebasestorage.app",
  messagingSenderId: "870798798773",
  appId: "1:870798798773:web:4bf5120353b75fcff073fc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    createUserWithEmailAndPassword(auth, email, password)
      .then(() => {
          alert("Account created successfully!");
          window.location.href = "dashboard.html";
      })
      .catch((error) => {
          alert(error.message);
      });
}
</script>
</body>
</html>
