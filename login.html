<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Let's Chat</title>

<link rel="stylesheet" href="styles.css">

<style>
body{
    background:#0b141a;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    width:90%;
    max-width:400px;
    background:#202c33;
    padding:30px;
    border-radius:15px;
}

.logo{
    text-align:center;
    font-size:40px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#25D366;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#2a3942;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    background:#25D366;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

p{
    text-align:center;
    margin-top:20px;
    color:white;
}

a{
    color:#25D366;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">💬</div>

    <h1>Let's Chat</h1>

    <input type="email" id="email" placeholder="Email Address">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">
        Login
    </button>

    <p>
        Don't have an account?
        <a href="register.html">Create Account</a>
    </p>

</div>

<script>
function login(){
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
