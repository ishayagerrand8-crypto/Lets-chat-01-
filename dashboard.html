<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111b21;
    color:white;
}

.header{
    background:#202c33;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h2{
    color:#25D366;
}

.chat-list{
    padding:10px;
}

.chat{
    display:flex;
    align-items:center;
    padding:15px;
    border-bottom:1px solid #2a3942;
    cursor:pointer;
}

.chat:hover{
    background:#202c33;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-right:15px;
}

.info{
    flex:1;
}

.name{
    font-weight:bold;
}

.message{
    color:#8696a0;
    font-size:14px;
}

.time{
    font-size:12px;
    color:#8696a0;
}
</style>
</head>

<body>

<div class="header">
    <h2>Let's Chat</h2>
    <span></span>
</div><script type="module">
        import { auth, db } from './firebase.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const registerBtn = document.getElementById('registerBtn');

        registerBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            if(!name || !email || !password) {
                alert("Please fill in all fields.");
                return;
            }

            try {
                // 1. Create the user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Save the name in Firestore
                await setDoc(doc(db, "users", user.uid), {
                    displayName: name,
                    email: email
                });

                // 3. Move to chat
                window.location.href = 'chat.html';
            } catch (error) {
                alert("Error: " + error.message);
            }
        });
</script>

<div class="chat-list">

    <div class="chat" onclick="window.location.href='chat.html'">
        <div class="avatar">J</div>
        <div class="info">
            <div class="name">John</div>
            <div class="message">Hey, how are you?</div>
        </div>
        <div class="time">10:20</div>
    </div>

    <div class="chat">
        <div class="avatar">S</div>
        <div class="info">
            <div class="name">Sarah</div>
            <div class="message">See you later!</div>
        </div>
        <div class="time">09:45</div>
    </div>

    <div class="chat">
        <div class="avatar">D</div>
        <div class="info">
            <div class="name">David</div>
            <div class="message">Good morning!</div>
        </div>
        <div class="time">08:30</div>
    </div>

<div class="new-chat" onclick="window.location.href='chat.html'">
    +
</div>

<style>
.new-chat{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#25D366;
    color:white;
    font-size:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
}
</style>

</body>
</html>
