<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Chat</title>

<link rel="stylesheet" href="styles.css">

<style>
body{
    margin:0;
    background:#0b141a;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    background:#25D366;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:50px;
    animation:pulse 1.5s infinite;
}

.title{
    margin-top:20px;
    font-size:32px;
    font-weight:bold;
}

.subtitle{
    color:#b0b3b8;
    margin-top:10px;
}

.loading{
    margin-top:30px;
}

.loading span{
    width:10px;
    height:10px;
    background:#25D366;
    border-radius:50%;
    display:inline-block;
    margin:0 5px;
    animation:bounce 1.4s infinite;
}

.loading span:nth-child(2){
    animation-delay:0.2s;
}

.loading span:nth-child(3){
    animation-delay:0.4s;
}

.footer{
    position:absolute;
    bottom:30px;
    text-align:center;
    width:100%;
    color:#b0b3b8;
}

.footer strong{
    color:#25D366;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

@keyframes bounce{
    0%,80%,100%{transform:scale(0);}
    40%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">💬</div>

    <div class="title">Let's Chat</div>

    <div class="subtitle">
        Simple • Fast • Secure
    </div>

    <div class="loading">
        <span></span>
        <span></span>
        <span></span>
    </div>

</div>

<div class="footer">
    from <strong>GERRAND</strong>
</div>

<script>
setTimeout(function(){
    window.location.href = "login.html";
}, 4000);
</script>

</body>
</html>
