<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Let's Chat</title>

<link rel="stylesheet" href="styles.css">

<style>
.header{
    display:flex;
    align-items:center;
    color:white;
}

.name{
    margin-left:10px;
    font-weight:bold;
}

.chat-area{
    height:calc(100vh - 140px);
    padding:15px;
    overflow-y:auto;
}

.message{
    padding:10px;
    border-radius:10px;
    margin:10px 0;
    max-width:75%;
}

.received{
    background:#202c33;
}

.sent{
    background:#25D366;
    margin-left:auto;
}

.input-area{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    padding:10px;
    background:#202c33;
}

.input-area input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:20px;
}

.input-area button{
    margin-left:10px;
}
</style>
</head>

<body>

<div class="header">
    <div class="avatar">J</div>
    <div class="name">John</div>
</div>

<div class="chat-area" id="chatArea">

    <div class="message received">
        Hello 
    </div>

    <div class="message sent">
        Welcome to Let's Chat!
    </div>

</div>

<div class="input-area">

    <input
        type="text"
        id="messageInput"
        placeholder="Type a message">

    <button class="btn" onclick="sendMessage()">
        Send
    </button>

</div>

<script>
function sendMessage(){

    const input =
    document.getElementById("messageInput");

    const chatArea =
    document.getElementById("chatArea");

    if(input.value.trim()===""){
        return;
    }

    const msg =
    document.createElement("div");

    msg.className =
    "message sent";

    msg.textContent =
    input.value;

    chatArea.appendChild(msg);

    input.value = "";

    chatArea.scrollTop =
    chatArea.scrollHeight;
}
</script>

</body>
</html>
