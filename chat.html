<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111b21;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    background:#202c33;
    color:white;
    padding:15px;
    display:flex;
    align-items:center;
}

.profile{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-right:10px;
    font-weight:bold;
}

.chat-area{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.message{
    max-width:75%;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
}

.received{
    background:#202c33;
    color:white;
}

.sent{
    background:#25D366;
    color:white;
    margin-left:auto;
}

.input-area{
    display:flex;
    padding:10px;
    background:#202c33;
}

.input-area input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:20px;
    outline:none;
}

.input-area button{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    border-radius:20px;
    background:#25D366;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
    <div class="profile">J</div>
    <div>John</div>
</div>

<div class="chat-area" id="chatArea">

    <div class="message received">
        Hello 👋
    </div>

    <div class="message sent">
        Hi! Welcome to Let's Chat.
    </div>

</div>

<div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
function sendMessage() {

    const input = document.getElementById("messageInput");
    const chatArea = document.getElementById("chatArea");

    if(input.value.trim() === "") return;

    const msg = document.createElement("div");

    msg.className = "message sent";
    msg.textContent = input.value;

    chatArea.appendChild(msg);

    input.value = "";

    chatArea.scrollTop = chatArea.scrollHeight;
}
</script>

</body>
</html>
