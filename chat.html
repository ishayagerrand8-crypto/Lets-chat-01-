<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="styles.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Chat</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111b21;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    background:#202c33;
    color:white;
    padding:15px;
    display:flex;
    align-items:center;
}

.profile{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-right:10px;
    font-weight:bold;
}

.chat-area{
    flex:1;
    padding:15px;
    overflow-y:auto;
}

.message{
    max-width:75%;
    padding:10px;
    margin:10px 0;
    border-radius:10px;
}

.received{
    background:#202c33;
    color:white;
}

.sent{
    background:#25D366;
    color:white;
    margin-left:auto;
}

.input-area{
    display:flex;
    padding:10px;
    background:#202c33;
}

.input-area input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:20px;
    outline:none;
}

.input-area button{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    border-radius:20px;
    background:#25D366;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
    <div class="profile">J</div>
    <div>John</div>
</div>

<div class="chat-area" id="chatArea">

    <div class="message received">
        Hello 👋
    </div>

    <div class="message sent">
        Hi! Welcome to Let's Chat.
    </div>

</div>

<div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message">
    <button id="sendBtn">Send</button>
</div>

<script type="module">
        import { auth, db } from './firebase.js';
        import { collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        let currentUser = null;

        // 1. Make sure a user is actually logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                // Load messages in real-time once user is verified
                loadMessages();
            } else {
                // If not logged in, boot them back to login page
                window.location.href = 'login.html';
            }
        });

        // 2. Send Message to Firestore
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "" || !currentUser) return;

            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    uid: currentUser.uid,
                    senderName: currentUser.displayName || "User",
                    timestamp: new Date().getTime()
                });
                messageInput.value = ""; // Clear input box
            } catch (error) {
                console.error("Error sending message: ", error);
            }
        }

        // Listen for button click or Enter key
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 3. Listen for Messages in Real-Time
        function loadMessages() {
            const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
            
            onSnapshot(q, (snapshot) => {
                chatArea.innerHTML = ""; // Clear old visual placeholders
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const msgDiv = document.createElement('div');
                    
                    // Check if the message was sent by the logged-in user
                    if (data.uid === currentUser.uid) {
                        msgDiv.className = "message sent";
                    } else {
                        msgDiv.className = "message received";
                    }
                    
                    msgDiv.textContent = data.text;
                    chatArea.appendChild(msgDiv);
                });
                
                // Auto-scroll to the bottom of the chat box
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        }
    </script>
</body>
</html>
